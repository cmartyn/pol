# Kamal deploy: the whole site on one $12 DigitalOcean droplet (pol-prod,
# nyc3). Three containers behind kamal-proxy — the web app, a good_job
# worker, and Postgres as an accessory — plus the proxy itself. The worker
# is the reason this exists: cron (2-hourly scrape, 6:30 ET floor model run,
# 7:00 ET brief) lives in a process that is up 24/7, which a laptop dev
# server structurally is not (docs/BUILD_NOTES.md).
service: pol

# registry.digitalocean.com/pol-forecast/pol — the free Starter registry
# tier: one repository, 500MB, same region as the droplet.
image: pol-forecast/pol

servers:
  web:
    - 68.183.55.31
  # Same box, second container: the dedicated worker the good_job
  # initializer's comment promises production runs. GoodJob's cron scheduler
  # rides inside it, so the recurring jobs fire without any server process
  # needing to also be a web server.
  job:
    hosts:
      - 68.183.55.31
    cmd: bundle exec good_job start

# kamal-proxy terminates SSL for the subdomain with an auto-issued Let's
# Encrypt certificate (production.rb's assume_ssl/force_ssl are on to
# match). Cloudflare sits in front of the DNS: DNS-only (gray cloud) just
# works; proxied (orange cloud) needs the zone's SSL/TLS mode set to
# "Full (strict)" so Cloudflare speaks HTTPS to the origin's real cert.
# With a host set, the proxy routes only this hostname — bare-IP requests
# stop resolving to the app, which is the point.
proxy:
  ssl: true
  host: 535.appmakey.com

# Credentials come from .kamal/secrets, which reads the macOS keychain —
# nothing secret is committed. The username is the DO account email; the
# password is a registry API token.
registry:
  server: registry.digitalocean.com
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    # The Postgres accessory's DNS name on Kamal's docker network —
    # database.yml reads this for the production host.
    DB_HOST: pol-db
  secret:
    - RAILS_MASTER_KEY
    - POL_DATABASE_PASSWORD

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Local Active Storage files (unused today, but the mount is cheap insurance
# against a future attachment quietly writing into an ephemeral container).
volumes:
  - "pol_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Apple Silicon builds cross-compile to the droplet's architecture.
builder:
  arch: amd64

# Postgres on the same droplet, data on a named docker directory that
# survives redeploys. No port mapping on purpose: the database is reachable
# only over Kamal's private docker network (as "pol-db"), never from the
# internet. Backups are a nightly pg_dump via cron on the droplet — the
# database is megabytes, not a managed-DB problem.
accessories:
  db:
    image: postgres:17
    host: 68.183.55.31
    env:
      clear:
        POSTGRES_USER: pol
        POSTGRES_DB: pol_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
