# Every forecast/newsroom constant lives in this file. The public methodology
# page renders from it — if a parameter is not here, it does not exist.
# citation fields marked VERIFY-PHASE-N are filled during that phase.
averaging:
  window_days: 45
  extended_window_days: 120
  half_life_days: 14
  default_sample_size: 400
  sample_size_cap: 1500
  sample_size_pivot: 600
blend:
  weight_saturation: 3.0
fundamentals:
  incumbency_adj: 1.5
  open_seat_adj: 1.5
  # D minus R, pct pts. Harris 75,017,613 (48.32%) vs Trump 77,302,580 (49.80%)
  # of 155,238,302 total (FEC certified).
  # citation: https://en.wikipedia.org/wiki/2024_United_States_presidential_election
  pres_national_margin_2024: -1.5
  # Biden 81,283,501 (51.31%) vs Trump 74,223,975 (46.85%) of 158,429,631 (FEC).
  # citation: https://en.wikipedia.org/wiki/2020_United_States_presidential_election
  pres_national_margin_2020: 4.5
  # National U.S. House popular vote: D 70,571,330 (47.2%) vs R 74,390,864
  # (49.8%), per the Clerk of the House's official 2024 election statistics.
  # citation: https://en.wikipedia.org/wiki/2024_United_States_House_of_Representatives_elections
  house_national_margin_2024: -2.6
  imputed_baseline_margin: 35.0
error_model:
  # election-day-equivalent sigmas, margin scale; citations VERIFY-PHASE-3
  sigma_national: 2.5
  sigma_state_polled: 3.5
  sigma_state_unpolled: 8.0
  sigma_district: 6.0
  time_scale_days: 180
  time_mult_cap: 1.75
chambers:
  # Seats not on the 2026 ballot. 53R/45D/2I now, less the 22 R and 13 D seats
  # up, leaves 31 R and 32 D + Sanders and King (both Class 1, both caucusing
  # with the Democrats) = 34 Democratic-caucus holdovers. 31 + 34 + 35 = 100.
  # citation: docs/BUILD_NOTES.md Phase 2 §A2 holdover arithmetic
  senate_holdover_dem_caucus: 34
  senate_holdover_rep: 31
  # The tiebreak. JD Vance is the sitting vice president, so Republicans hold
  # the Senate at 50 and Democrats need 51.
  # citation: docs/BUILD_NOTES.md Phase 2 §A2
  vp_party: "rep"
  # 435 seats; a majority is 218.
  house_majority_seats: 218
simulation:
  n_sims: 10000
election:
  date: "2026-11-03"
newsroom:
  writer_model: null   # OpenRouter slug. VERIFY-PHASE-5 via GET /api/v1/models
  brief_model: null    # VERIFY-PHASE-5
  max_dispatches_per_race_per_day: 3
  max_dispatches_per_day: 40
  movement_threshold: 0.08
  headline_max_chars: 90
  dek_max_chars: 200
  body_max_words: 450
scrape:
  cadence_hours: 2
  user_agent_contact: "cmartyn@gmail.com"
