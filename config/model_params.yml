# Every forecast/newsroom constant lives in this file. The public methodology
# page renders from it — if a parameter is not here, it does not exist.
# citation fields marked VERIFY-PHASE-N are filled during that phase.
averaging:
  window_days: 45
  extended_window_days: 120
  # Below this many usable polls inside window_days, the window widens to
  # extended_window_days. One poll is a data point; two is the beginning of an
  # average, and a lone poll deserves company from further back before the
  # model leans on it.
  min_polls_in_window: 2
  half_life_days: 14
  default_sample_size: 400
  sample_size_cap: 1500
  sample_size_pivot: 600
house_effects:
  # A pollster's house effect is what 538 calls the tendency of a firm's polls
  # to lean one way "relative to the average poll". We estimate it as the
  # weighted mean signed residual of that firm's polls against a leave-one-out
  # average of the same quantity, shrink it toward zero by how many residuals
  # stand behind it, cap it, and subtract it. Sign convention: positive means
  # the firm runs more Democratic than the field. The full reasoning, and the
  # two constants this project had to choose without a published precedent,
  # are in docs/BUILD_NOTES.md Phase 9 §A.
  #
  # One departure worth stating up front, because both published models do it
  # the other way: 538 runs its aggregation three times (baseline, outliers,
  # then house and population effects) and Silver Bulletin loops the average
  # and the house effects until the numbers stop moving. We compute effects
  # once, from unadjusted averages, and use them. That is a simplification,
  # not a refinement, and it is on the methodology page as one.
  # citation: https://abcnews.com/538/polling-averages-work/story?id=103232260
  # citation: https://www.natesilver.net/p/silver-bulletin-polling-average-methodology
  enabled: true
  # Below this many residuals the effect is published but not subtracted.
  # No published model uses a hard gate at all — 538 and Silver Bulletin both
  # rely on continuous shrinkage alone — so this is belt and braces on top of
  # the shrinkage below, and the tension is worth naming: where those
  # methodologies do state hard minimums they cluster at five (538 needs five
  # polls from three pollsters before it will publish a race average; Silver's
  # own house-effect table used firms with at least five polls of the race).
  # Three is kept because shrinkage has already cut an n=3 effect by 62% by
  # the time this gate sees it, so the gate is catching n=1 and n=2, where the
  # "effect" is one poll's sampling error. Raising it to 5 is a one-line
  # change and BUILD_NOTES Phase 9 §A2 records what it would cost.
  # citation: https://www.natesilver.net/p/which-polls-are-biased-toward-harris
  min_polls_to_apply: 3
  # effect_shrunk = effect_raw × n / (n + k). This is 538's own pollster-
  # ratings form — "Adjusted Error × (n / (n + n_shrinkage)) + group prior ×
  # (n_shrinkage / (n + n_shrinkage))" — with the group prior set to zero,
  # which is what makes it a pull toward "no house effect". 538 describes
  # n_shrinkage as the effective number of polls' worth of weight to put on
  # the prior and says it optimised the value, but does not publish it; k = 5
  # is therefore OURS, not theirs. It halves an effect at n = 5 and leaves 83%
  # of it at n = 25, which puts the corpus's 71 sub-three-poll houses firmly
  # on zero and lets its dozen prolific ones keep most of what they show.
  # citation: https://abcnews.com/538/538s-pollster-ratings-work/story?id=105398138
  shrinkage_k: 5.0
  # Clamp on |shrunk effect|, in points of D−R margin. Two independent anchors
  # put the ceiling here. 538's house-effect prior is a normal centred on zero
  # whose standard deviation its optimiser picks and which is "usually it's
  # around 3 points"; and the largest house effects Silver Bulletin measured
  # across the whole 2024 presidential field were Trafalgar at −2.7 and
  # Rasmussen at −2.6 on the margin, with the most Democratic-leaning firms
  # at about +1.9. A cap at 3.0 sits just above the largest effect either
  # source reports, so it binds on estimates the literature says should not
  # happen rather than on ordinary ones.
  # citation: https://abcnews.com/538/polling-averages-work/story?id=103232260
  # citation: https://www.natesilver.net/p/which-polls-are-biased-toward-harris
  max_effect_pp: 3.0
  # How far either side of a poll's field_end the leave-one-out comparison
  # average reaches. Set equal to averaging.window_days on purpose: the field
  # a poll is judged against should be the same field the model would have
  # published, not a differently-shaped one. Symmetric rather than backward-
  # looking, so that a genuine trend in the race does not read as a lean —
  # a backward-only window would sit an average of two to three weeks behind
  # each poll and charge every pollster for the movement in between.
  residual_window_days: 45
  # Residuals are time-decayed toward the run date, so a house effect reflects
  # recent behaviour — but on a half-life of its own, NOT averaging.
  # half_life_days. A house effect is a slow-moving property of a firm's
  # methodology; the 14-day half-life is tuned for a fast-moving race. Applied
  # here it would leave RMG Research's 24 polls carrying 1.4 polls of
  # effective information while the shrinkage term above, which counts polls,
  # saw 24 and barely shrank at all — a confident-looking adjustment resting
  # on one recent poll's sampling error. At 180 days the same 24 polls carry
  # 19.1, so the count the shrinkage reads and the information behind it agree.
  # Measured, per pollster, in docs/BUILD_NOTES.md Phase 9 §A3.
  residual_half_life_days: 180
  # A residual needs at least this many OTHER houses in the window before it
  # counts. Against one other house a residual is not a distance from the
  # field, it is the gap between two polls — half of it the other house's own
  # lean — and it lands in both firms' estimates equal and opposite. The
  # approved design asks for race-level residuals only "where a race has
  # enough distinct pollsters to define a meaningful average"; this is that
  # rule, applied to the generic ballot too so there is one standard for what
  # counts as a field. Idaho is the live case it was written for
  # (BUILD_NOTES Phase 9 §A4).
  min_comparison_pollsters: 3
blend:
  weight_saturation: 3.0
fundamentals:
  incumbency_adj: 1.5
  open_seat_adj: 1.5
  # D minus R, pct pts. Harris 75,017,613 (48.32%) vs Trump 77,302,580 (49.80%)
  # of 155,238,302 total (FEC certified).
  # citation: https://en.wikipedia.org/wiki/2024_United_States_presidential_election
  pres_national_margin_2024: -1.5
  # Biden 81,283,501 (51.31%) vs Trump 74,223,975 (46.85%) of 158,429,631 (FEC).
  # citation: https://en.wikipedia.org/wiki/2020_United_States_presidential_election
  pres_national_margin_2020: 4.5
  # National U.S. House popular vote: D 70,571,330 (47.2%) vs R 74,390,864
  # (49.8%), per the Clerk of the House's official 2024 election statistics.
  # citation: https://en.wikipedia.org/wiki/2024_United_States_House_of_Representatives_elections
  house_national_margin_2024: -2.6
  imputed_baseline_margin: 35.0
error_model:
  # Election-day-equivalent standard deviations, on the D−R margin scale. Each
  # race's total error is sigma_national (shared by every race in a simulated
  # world) and the race's own sigma, combined in quadrature. Anchors verified
  # against the published literature in Phase 3; the full reasoning, including
  # the one value that moved, is in docs/BUILD_NOTES.md Phase 3 §A.
  #
  # Signed national polling error on the margin, final two weeks, all offices:
  # 2016 +3.1, 2018 +0.1, 2020 +4.6, 2022 −0.6, 2024 +2.7 → RMS about zero 2.8,
  # sample SD 2.2. The 2020 task force's presidential series (−1.1, +1.4, +0.7,
  # −2.4, +1.3, +3.9 from 2000) gives RMS 2.1. 2.5 sits in the middle.
  # citation: https://aapor.org/wp-content/uploads/2025/10/Task-Force-on-2024-Pre-Election-Polling-Report-Executive-Summary.pdf
  # citation: https://aapor.org/wp-content/uploads/2022/11/AAPOR-Task-Force-on-2020-Pre-Election-Polling_Report-FNL.pdf
  sigma_national: 2.5
  # Raised from 3.5 in Phase 3 — see BUILD_NOTES Phase 3 §A2. 538's 2024
  # presidential model expects "a hair over 2 points" of share error in a
  # competitive state, "around 3.8 points on the margin" (MAE 3.8 → sigma
  # ≈ 4.75); Shirani-Mehr et al. put election-level Senate bias at 2.0% of
  # share on election day, ~4.0 points of margin MAE → sigma ≈ 5.0. With
  # sigma_national 2.5, a 4.0 here totals 4.72; 3.5 totalled 4.30, below every
  # anchor found.
  # citation: https://abcnews.com/538/538s-2024-presidential-election-forecast-works/story?id=113068753
  # citation: https://sites.stat.columbia.edu/gelman/research/published/polling-errors.pdf
  sigma_state_polled: 4.0
  # A race with no polls is a fundamentals estimate. 538 on their own: "we
  # would expect our fundamentals model to miss the vote margin in the average
  # state by about 6.5 points" — MAE 6.5 → sigma ≈ 8.15.
  # citation: https://abcnews.com/538/538s-2024-presidential-election-forecast-works/story?id=113068753
  sigma_state_unpolled: 8.0
  # 538's 2024 House model decomposes seat-level error exactly this way: "about
  # 3 points of error at the national level, 2 each at the regional and state
  # levels, 2 at the demographic-cluster level, and 6 at the district level",
  # combined in quadrature. Our district term matches theirs; our single
  # national term is narrower than their four correlated ones, which is a
  # known and recorded limitation (BUILD_NOTES Phase 3 §A4).
  # citation: https://abcnews.com/538/538s-2024-house-election-forecast-works/story?id=114446291
  sigma_district: 6.0
  # Time inflation: t = min(time_mult_cap, 1 + days_to_election/time_scale_days).
  # Shirani-Mehr et al. Figure 2 (7,040 polls) shows Senate poll error about
  # 1.7x its election-day level three months out, and AAPOR 2020 found error
  # "stable throughout the campaign" over the final weeks — which is the flat
  # region this formula produces (1.12x at three weeks).
  # citation: https://sites.stat.columbia.edu/gelman/research/published/polling-errors.pdf
  time_scale_days: 180
  time_mult_cap: 1.75
chambers:
  # Seats not on the 2026 ballot. 53R/45D/2I now, less the 22 R and 13 D seats
  # up, leaves 31 R and 32 D + Sanders and King (both Class 1, both caucusing
  # with the Democrats) = 34 Democratic-caucus holdovers. 31 + 34 + 35 = 100.
  # citation: docs/BUILD_NOTES.md Phase 2 §A2 holdover arithmetic
  senate_holdover_dem_caucus: 34
  senate_holdover_rep: 31
  # The tiebreak. JD Vance is the sitting vice president, so Republicans hold
  # the Senate at 50 and Democrats need 51.
  # citation: docs/BUILD_NOTES.md Phase 2 §A2
  vp_party: "rep"
  # 100 senators, so a tie is 50 and a majority without the tiebreak is 51.
  # The simulator derives both Senate thresholds from this and vp_party rather
  # than carrying 50 and 51 as literals: the vice president's party controls at
  # a tie, everyone else needs a majority. Fixed at 100 by Article I and 50
  # states; here because the arithmetic reads from it.
  senate_total_seats: 100
  # 435 seats; a majority is 218.
  house_majority_seats: 218
simulation:
  n_sims: 10000
  # How long a run may sit in `running` before the next run treats it as dead,
  # marks it failed and takes over. A full run measures 1.6 seconds, so 30
  # minutes is about a thousand times the observed runtime — no healthy run is
  # still going — while staying well inside the 2-hour scrape cadence, so a
  # process killed mid-run costs at most one cycle rather than freezing the
  # forecast until someone notices.
  stale_run_minutes: 30
election:
  date: "2026-11-03"
newsroom:
  # Both slugs verified live on 2026-08-11 against OpenRouter's public model
  # list: `anthropic/claude-sonnet-5` (canonical
  # `anthropic/claude-sonnet-5-20260630`, 1M context, 128k max completion,
  # $2/M input and $10/M output) is the current Anthropic Sonnet-tier model,
  # and its supported_parameters include `structured_outputs`, `response_format`
  # and `max_tokens` — the three things Newsroom::Client depends on. Each is a
  # one-string swap: nothing in the code knows which model it is talking to.
  # citation: https://openrouter.ai/api/v1/models (retrieved 2026-08-11)
  writer_model: "anthropic/claude-sonnet-5"
  brief_model: "anthropic/claude-sonnet-5"
  # A dispatch is a headline, a dek and at most body_max_words of prose —
  # roughly 700 tokens of JSON at the ceiling. 2000 leaves room for a long
  # piece without leaving room for a runaway one.
  max_output_tokens: 2000
  max_dispatches_per_race_per_day: 3
  max_dispatches_per_day: 40
  movement_threshold: 0.08
  # A race that moved gets at most one movement note per this many days. The
  # window the movement itself is measured over is site.movers_window_days;
  # this is the separate question of how often the same race may be written
  # up, and a rolling week means a race that drifts every day is news once.
  movement_note_cooldown_days: 7
  # How many recent polls the daily brief is shown to choose from, and how
  # many recent headlines any piece is shown so it doesn't repeat itself.
  brief_poll_count: 12
  recent_headline_count: 5
  headline_max_chars: 90
  dek_max_chars: 200
  body_max_words: 450
scrape:
  cadence_hours: 2
  user_agent_contact: "cmartyn@gmail.com"
  # Ceiling on how many state House pages one sweep will read for district
  # polls. Thirty-three states carry district polling today (Ingest::Sources::
  # DISTRICT_POLL_STATES, established by reading all fifty once); the ceiling
  # sits a little above that so the list can grow without the sweep's cost
  # growing unwatched. Anything past it is skipped and named in the log.
  # citation: docs/BUILD_NOTES.md Phase 8 §A (state-by-state district survey)
  max_district_sources: 40
site:
  # Rolling comparison window for the dashboard's "Movers" module: the latest
  # succeeded model run is compared against the succeeded run closest to this
  # many days before it (closest, not "within" — history is short right now,
  # a handful of runs, so the module has to work with whatever exists).
  movers_window_days: 7
  # Below this many points of |Δ p_dem_win|, a shift is Monte Carlo noise, not
  # a mover. Five same-seed reruns of the live board measured ~1.4pp of
  # run-to-run noise on the Senate control probability at n_sims=10,000; 1.5
  # sits just above that floor.
  # citation: docs/BUILD_NOTES.md Phase 3 §8.2 (10,000-sim noise measurement)
  movers_floor_pp: 1.5
  # How many races the dashboard's Movers module shows.
  movers_count: 6
  # A race whose leading side's win probability is at or under this renders
  # "Tossup" as its headline descriptor instead of "Favors {Party}". Editorial
  # language choice, not a model parameter — the underlying probability is
  # unchanged and still shown.
  tossup_band_pp: 65.0
