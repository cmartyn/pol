# Every forecast/newsroom constant lives in this file. The public methodology
# page renders from it — if a parameter is not here, it does not exist.
# citation fields marked VERIFY-PHASE-N are filled during that phase.
averaging:
  window_days: 45
  extended_window_days: 120
  # Below this many usable polls inside window_days, the window widens to
  # extended_window_days. One poll is a data point; two is the beginning of an
  # average, and a lone poll deserves company from further back before the
  # model leans on it.
  min_polls_in_window: 2
  half_life_days: 14
  default_sample_size: 400
  sample_size_cap: 1500
  sample_size_pivot: 600
house_effects:
  # A pollster's house effect is what 538 calls the tendency of a firm's polls
  # to lean one way "relative to the average poll". We estimate it as the
  # weighted mean signed residual of that firm's polls against a leave-one-out
  # average of the same quantity, shrink it toward zero by how many residuals
  # stand behind it, cap it, and subtract it. Sign convention: positive means
  # the firm runs more Democratic than the field. The full reasoning, and the
  # two constants this project had to choose without a published precedent,
  # are in docs/BUILD_NOTES.md Phase 9 §A.
  #
  # One departure worth stating up front, because both published models do it
  # the other way: 538 runs its aggregation three times (baseline, outliers,
  # then house and population effects) and Silver Bulletin loops the average
  # and the house effects until the numbers stop moving. We compute effects
  # once, from unadjusted averages, and use them. That is a simplification,
  # not a refinement, and it is on the methodology page as one.
  # citation: https://abcnews.com/538/polling-averages-work/story?id=103232260
  # citation: https://www.natesilver.net/p/silver-bulletin-polling-average-methodology
  enabled: true
  # Below this many residuals the effect is published but not subtracted.
  # No published model uses a hard gate at all — 538 and Silver Bulletin both
  # rely on continuous shrinkage alone — so this is belt and braces on top of
  # the shrinkage below, and the tension is worth naming: where those
  # methodologies do state hard minimums they cluster at five (538 needs five
  # polls from three pollsters before it will publish a race average; Silver's
  # own house-effect table used firms with at least five polls of the race).
  # Three is kept because shrinkage has already cut an n=3 effect by 62% by
  # the time this gate sees it, so the gate is catching n=1 and n=2, where the
  # "effect" is one poll's sampling error. Raising it to 5 is a one-line
  # change and BUILD_NOTES Phase 9 §A2 records what it would cost.
  # citation: https://www.natesilver.net/p/which-polls-are-biased-toward-harris
  min_polls_to_apply: 3
  # effect_shrunk = effect_raw × n / (n + k). This is 538's own pollster-
  # ratings form — "Adjusted Error × (n / (n + n_shrinkage)) + group prior ×
  # (n_shrinkage / (n + n_shrinkage))" — with the group prior set to zero,
  # which is what makes it a pull toward "no house effect". 538 describes
  # n_shrinkage as the effective number of polls' worth of weight to put on
  # the prior and says it optimised the value, but does not publish it; k = 5
  # is therefore OURS, not theirs. It halves an effect at n = 5 and leaves 83%
  # of it at n = 25, which puts the corpus's 71 sub-three-poll houses firmly
  # on zero and lets its dozen prolific ones keep most of what they show.
  # citation: https://abcnews.com/538/538s-pollster-ratings-work/story?id=105398138
  shrinkage_k: 5.0
  # Clamp on |shrunk effect|, in points of D−R margin. Two independent anchors
  # put the ceiling here. 538's house-effect prior is a normal centred on zero
  # whose standard deviation its optimiser picks and which is "usually it's
  # around 3 points"; and the largest house effects Silver Bulletin measured
  # across the whole 2024 presidential field were Trafalgar at −2.7 and
  # Rasmussen at −2.6 on the margin, with the most Democratic-leaning firms
  # at about +1.9. A cap at 3.0 sits just above the largest effect either
  # source reports, so it binds on estimates the literature says should not
  # happen rather than on ordinary ones.
  # citation: https://abcnews.com/538/polling-averages-work/story?id=103232260
  # citation: https://www.natesilver.net/p/which-polls-are-biased-toward-harris
  max_effect_pp: 3.0
  # How far either side of a poll's field_end the leave-one-out comparison
  # average reaches. Set equal to averaging.window_days on purpose: the field
  # a poll is judged against should be the same field the model would have
  # published, not a differently-shaped one. Symmetric rather than backward-
  # looking, so that a genuine trend in the race does not read as a lean —
  # a backward-only window would sit an average of two to three weeks behind
  # each poll and charge every pollster for the movement in between.
  residual_window_days: 45
  # Residuals are time-decayed toward the run date, so a house effect reflects
  # recent behaviour — but on a half-life of its own, NOT averaging.
  # half_life_days. A house effect is a slow-moving property of a firm's
  # methodology; the 14-day half-life is tuned for a fast-moving race. Applied
  # here it would leave RMG Research's 24 polls carrying 1.4 polls of
  # effective information while the shrinkage term above, which counts polls,
  # saw 24 and barely shrank at all — a confident-looking adjustment resting
  # on one recent poll's sampling error. At 180 days the same 24 polls carry
  # 19.1, so the count the shrinkage reads and the information behind it agree.
  # Measured, per pollster, in docs/BUILD_NOTES.md Phase 9 §A3.
  residual_half_life_days: 180
  # A residual needs at least this many OTHER houses in the window before it
  # counts. Against one other house a residual is not a distance from the
  # field, it is the gap between two polls — half of it the other house's own
  # lean — and it lands in both firms' estimates equal and opposite. The
  # approved design asks for race-level residuals only "where a race has
  # enough distinct pollsters to define a meaningful average"; this is that
  # rule, applied to the generic ballot too so there is one standard for what
  # counts as a field. Idaho is the live case it was written for
  # (BUILD_NOTES Phase 9 §A4).
  min_comparison_pollsters: 3
blend:
  weight_saturation: 3.0
fundamentals:
  incumbency_adj: 1.5
  open_seat_adj: 1.5
  # D minus R, pct pts. Harris 75,017,613 (48.32%) vs Trump 77,302,580 (49.80%)
  # of 155,238,302 total (FEC certified).
  # citation: https://en.wikipedia.org/wiki/2024_United_States_presidential_election
  pres_national_margin_2024: -1.5
  # Biden 81,283,501 (51.31%) vs Trump 74,223,975 (46.85%) of 158,429,631 (FEC).
  # citation: https://en.wikipedia.org/wiki/2020_United_States_presidential_election
  pres_national_margin_2020: 4.5
  # National U.S. House popular vote: D 70,571,330 (47.2%) vs R 74,390,864
  # (49.8%), per the Clerk of the House's official 2024 election statistics.
  # citation: https://en.wikipedia.org/wiki/2024_United_States_House_of_Representatives_elections
  house_national_margin_2024: -2.6
  imputed_baseline_margin: 35.0
error_model:
  # Election-day-equivalent standard deviations, on the D−R margin scale. A
  # race's error is FOUR terms combined in quadrature: national (every race in
  # a simulated world), regional (every race in the same census division),
  # state (a state's Senate race and every one of its House districts), and the
  # race's own idiosyncratic term. Phase 10 replaced a single correlated term
  # with this structure; the reasoning, the arithmetic and the measured effect
  # are in docs/BUILD_NOTES.md Phase 10 §A. Phase 3 §A has the original anchors.
  #
  # THE BACK-SOLVE, because these are the numbers a reader will want to check:
  #   correlated total          sqrt(3² + 2² + 2²)   = sqrt(17)    = 4.1231
  #   Senate polled, total      sqrt(2.5² + 4.0²)    = sqrt(22.25) = 4.7170  (unchanged)
  #     → idiosyncratic         sqrt(22.25 − 17)     = sqrt(5.25)  = 2.2913
  #   Senate unpolled, total    sqrt(2.5² + 8.0²)    = sqrt(70.25) = 8.3815  (unchanged)
  #     → idiosyncratic         sqrt(70.25 − 17)     = sqrt(53.25) = 7.2973
  #   House district, total     sqrt(17 + 6²)        = sqrt(53)    = 7.2801  (was 6.5000)
  # The two Senate totals are the AAPOR/Shirani-Mehr-calibrated numbers Phase 3
  # arrived at, preserved: variance moves from the independent channel to the
  # correlated one, none is invented. The two idiosyncratic terms are stored to
  # four decimals rather than in full, which puts the unpolled total back at
  # 8.3816 against 8.3815 — a ten-thousandth of a point, on a quantity whose
  # anchors are quoted to one. The House district total is the
  # one number that rises, deliberately: 6.0 is 538's own cited district-level
  # value, while our old 6.5000 total was never independently calibrated — it
  # was an artifact of having only one correlated term. 7.2801 is closer to
  # 538's 7.5498 (sqrt(57)) than 6.5000 was.
  #
  # 538's national component. Raised from 2.5, and the reason is structural
  # rather than evidentiary: the three correlated terms below are 538's
  # published decomposition, and a decomposition only means anything taken
  # whole — pairing our national term with their regional and state ones would
  # produce a correlated total that neither source stands behind. The AAPOR
  # anchors that put 2.5 "in the middle" still hold at the level they actually
  # constrain, which is a race's TOTAL error, and the back-solve above keeps
  # both Senate totals exactly where they were. Signed national polling error
  # on the margin, final two weeks, all offices: 2016 +3.1, 2018 +0.1,
  # 2020 +4.6, 2022 −0.6, 2024 +2.7 → RMS about zero 2.8, sample SD 2.2. The
  # 2020 task force's presidential series (−1.1, +1.4, +0.7, −2.4, +1.3, +3.9
  # from 2000) gives RMS 2.1. 3.0 sits just above that range and is 538's.
  # citation: https://abcnews.com/538/538s-2024-house-election-forecast-works/story?id=114446291
  # citation: https://aapor.org/wp-content/uploads/2025/10/Task-Force-on-2024-Pre-Election-Polling-Report-Executive-Summary.pdf
  # citation: https://aapor.org/wp-content/uploads/2022/11/AAPOR-Task-Force-on-2020-Pre-Election-Polling_Report-FNL.pdf
  sigma_national: 3.0
  # 538's regional component, applied at the census-division level: one draw
  # per division per simulated world, shared by every race in it. We use the
  # nine Census divisions rather than the four Census regions because a
  # four-region split would have one shock cover the whole South — see
  # Pol::CensusDivisions, which carries the mapping and its census.gov source.
  # citation: https://abcnews.com/538/538s-2024-house-election-forecast-works/story?id=114446291
  # citation: https://www2.census.gov/programs-surveys/popest/geographies/2023/state-geocodes-v2023.xlsx
  sigma_regional: 2.0
  # 538's state component, and the structural point of Phase 10: one draw per
  # state per simulated world, read by that state's Senate race AND by every
  # one of its House districts. It is what makes a bad night in Georgia a bad
  # night for Georgia's Senate race and its fourteen districts together,
  # instead of fifteen independent coin flips around a shared national mood.
  # citation: https://abcnews.com/538/538s-2024-house-election-forecast-works/story?id=114446291
  sigma_state: 2.0
  # A polled Senate race's own error, back-solved above so its total stays at
  # Phase 3's 4.7170. Renamed from sigma_state_polled in Phase 10: with a
  # genuine state-level term now sitting above it, a name saying "state" for a
  # single race's idiosyncratic noise was actively misleading. The anchors
  # behind the 4.7170 it preserves: 538's 2024 presidential model expects "a
  # hair over 2 points" of share error in a competitive state, "around 3.8
  # points on the margin" (MAE 3.8 → sigma ≈ 4.75); Shirani-Mehr et al. put
  # election-level Senate bias at 2.0% of share on election day, ~4.0 points of
  # margin MAE → sigma ≈ 5.0.
  # citation: https://abcnews.com/538/538s-2024-presidential-election-forecast-works/story?id=113068753
  # citation: https://sites.stat.columbia.edu/gelman/research/published/polling-errors.pdf
  sigma_senate_polled: 2.2913
  # The same, for a Senate race with no polls: a fundamentals estimate, total
  # preserved at 8.3815. 538 on their own fundamentals: "we would expect our
  # fundamentals model to miss the vote margin in the average state by about
  # 6.5 points" — MAE 6.5 → sigma ≈ 8.15.
  # citation: https://abcnews.com/538/538s-2024-presidential-election-forecast-works/story?id=113068753
  sigma_senate_unpolled: 7.2973
  # 538's 2024 House model decomposes seat-level error exactly this way: "about
  # 3 points of error at the national level, 2 each at the regional and state
  # levels, 2 at the demographic-cluster level, and 6 at the district level",
  # combined in quadrature ("These numbers don't add up to 8 points because
  # uncorrelated errors are not additive"). We now carry four of their five
  # terms at their values. The one we omit is the demographic-cluster 2.0: it
  # needs cluster assignments we have no data for, so our correlated total is
  # 4.1231 against their sqrt(21) = 4.5826, and the methodology page says so.
  # citation: https://abcnews.com/538/538s-2024-house-election-forecast-works/story?id=114446291
  sigma_district: 6.0
  # Time inflation: t = min(time_mult_cap, 1 + days_to_election/time_scale_days).
  # Shirani-Mehr et al. Figure 2 (7,040 polls) shows Senate poll error about
  # 1.7x its election-day level three months out, and AAPOR 2020 found error
  # "stable throughout the campaign" over the final weeks — which is the flat
  # region this formula produces (1.12x at three weeks).
  # citation: https://sites.stat.columbia.edu/gelman/research/published/polling-errors.pdf
  time_scale_days: 180
  time_mult_cap: 1.75
chambers:
  # Seats not on the 2026 ballot. 53R/45D/2I now, less the 22 R and 13 D seats
  # up, leaves 31 R and 32 D + Sanders and King (both Class 1, both caucusing
  # with the Democrats) = 34 Democratic-caucus holdovers. 31 + 34 + 35 = 100.
  # citation: docs/BUILD_NOTES.md Phase 2 §A2 holdover arithmetic
  senate_holdover_dem_caucus: 34
  senate_holdover_rep: 31
  # The tiebreak. JD Vance is the sitting vice president, so Republicans hold
  # the Senate at 50 and Democrats need 51.
  # citation: docs/BUILD_NOTES.md Phase 2 §A2
  vp_party: "rep"
  # 100 senators, so a tie is 50 and a majority without the tiebreak is 51.
  # The simulator derives both Senate thresholds from this and vp_party rather
  # than carrying 50 and 51 as literals: the vice president's party controls at
  # a tie, everyone else needs a majority. Fixed at 100 by Article I and 50
  # states; here because the arithmetic reads from it.
  senate_total_seats: 100
  # 435 seats; a majority is 218.
  house_majority_seats: 218
simulation:
  # Simulated elections per variant. A run draws the board TWICE — once
  # excluding partisan internals, once including them (Forecast::Runner
  # #forecast!) — so a model run is 2 x n_sims draws of 470 races.
  #
  # Raised from 10,000 on 2026-08-31. Not for accuracy: Monte Carlo error at
  # 10,000 was already ~0.5pp on a 50/50 probability, an order of magnitude
  # under the structural uncertainty this model admits to elsewhere on the
  # methodology page (the missing demographic-cluster term is worth "a point
  # or so, and at the outside three"). More draws cannot fix that and this
  # change does not claim to.
  #
  # It was raised for STABILITY, because the site republishes every two hours
  # and rng_seed is fresh each run (Forecast::Runner#start_run!). At 10,000 a
  # reader refreshing against an unchanged poll corpus saw the Senate figure
  # move up to 1.4pp for no reason but the seed — measured across five seeds
  # on identical inputs, BUILD_NOTES Phase 3 SS8.2. Noise falls as 1/sqrt(n),
  # so 100,000 puts that at ~0.44pp, and the run-to-run wobble drops below
  # the resolution the page prints.
  #
  # THE COST, measured 2026-08-31 on a 470-race board (35 Senate + 435 House),
  # one variant, per n_sims - seconds and peak RSS:
  #     10,000    1.6s   166 MB       250,000   45.6s   360 MB
  #     50,000    8.6s   254 MB       500,000   92.9s   683 MB
  #    100,000   17.6s   270 MB     1,000,000  190.6s  1004 MB
  # Double the seconds for a run (two variants). Time is not the constraint —
  # even 250,000 finishes in minutes against a 2-hour cadence and the
  # stale_run_minutes cutoff below. MEMORY is: production is one 2GB droplet
  # running web, worker, Postgres and the proxy together (docs/DEPLOY.md), and
  # the simulator holds ~60 full-length shared-error series (1 national + 9
  # divisions + 50 states), so RSS climbs linearly with n_sims. 100,000 sits
  # at 270 MB with room to spare; 500,000 and up is an OOM waiting for a bad
  # moment on that box, and is the reason this is not higher.
  n_sims: 100000
  # How long a run may sit in `running` before the next run treats it as dead,
  # marks it failed and takes over. A full run measures tens of seconds at the
  # n_sims above, so 30 minutes is two orders of magnitude past the observed
  # runtime — no healthy run is still going — while staying well inside the
  # 2-hour scrape cadence, so a process killed mid-run costs at most one cycle
  # rather than freezing the forecast until someone notices.
  stale_run_minutes: 30
election:
  date: "2026-11-03"
newsroom:
  # Both slugs verified live on 2026-08-12 against OpenRouter's public model
  # list: `anthropic/claude-opus-5` (canonical
  # `anthropic/claude-opus-5-20260723`, 1M context, 128k max completion,
  # $5/M input and $25/M output) advertises `structured_outputs`,
  # `response_format` and `max_tokens` — the three things Newsroom::Client
  # depends on — and a live A/B against the same brief payload confirmed all
  # three work in practice, not just in the catalogue.
  #
  # These stay two keys rather than one because the roles differ. The brief is
  # one flagship piece a day where causal explanation earns its cost; reactions
  # run at volume (23 in six minutes on 2026-08-12) where it mostly does not.
  # Both are Opus today by choice, not by coupling: either is a one-string swap
  # and nothing in the code knows which model it is talking to.
  #
  # Measured on an identical 12-poll brief payload (2026-08-12): Opus explained
  # the 51-vs-50 Senate asymmetry as the cause of the probability gap, attached
  # every number to a named candidate, and volunteered that the size of the
  # House overstatement is unmeasured. Sonnet enumerated the same facts, left
  # one Alaska margin ambiguous as to who led, and used the "X in 100" phrasing
  # four times against a style guide that asks for one.
  # citation: https://openrouter.ai/api/v1/models (retrieved 2026-08-12)
  writer_model: "anthropic/claude-opus-5"
  brief_model: "anthropic/claude-opus-5"
  # A dispatch is a headline, a dek and a few hundred words of prose — the
  # longest target (Newsroom::Prompts::BODY_WORD_TARGETS) is roughly 700 tokens
  # of JSON. 2000 leaves room for a piece that overruns without leaving room
  # for a runaway one: it truncates around 1,400 words, above the
  # body_words_backstop below, so a runaway is rejected as a word count rather
  # than as JSON that stops mid-string.
  max_output_tokens: 2000
  max_dispatches_per_race_per_day: 3
  max_dispatches_per_day: 40
  movement_threshold: 0.08
  # A race that moved gets at most one movement note per this many days. The
  # window the movement itself is measured over is site.movers_window_days;
  # this is the separate question of how often the same race may be written
  # up, and a rolling week means a race that drifts every day is news once.
  movement_note_cooldown_days: 7
  # How many recent polls the daily brief is shown to choose from, and how
  # many recent headlines any piece is shown so it doesn't repeat itself.
  brief_poll_count: 12
  recent_headline_count: 5
  headline_max_chars: 90
  dek_max_chars: 200
  # Not the house-style length — that is per kind, in
  # Newsroom::Prompts::BODY_WORD_TARGETS, and it is guidance the writer aims at
  # rather than a gate. This is the validator's backstop, deliberately far
  # above every one of those targets.
  #
  # The split exists because a rejection costs the whole piece: one retry, and
  # a second failure publishes nothing. That trade is right for a fabricated
  # citation and wrong for a long one — a 472-word brief against a 450-word
  # gate cost a morning's brief outright, and no reader would have noticed the
  # 22 words. Length is house style, not a truth claim.
  #
  # 1000 is a bit over twice the largest target and roughly three times the
  # longest piece this site has published, so only runaway output reaches it.
  # It also sits below the ~1,400 words max_output_tokens truncates at, so a
  # runaway is caught as a word count rather than as unparseable JSON.
  body_words_backstop: 1000
scrape:
  # The Wikipedia sweep is the warm fallback since the NYT feed became the
  # corpus: a weekly dry run (config/initializers/good_job.rb) that parses
  # every page and records scrape_runs — layout rot still alarms — but
  # writes no polls while this is false. Re-arming the fallback is this
  # flag plus restoring a frequent cron; see docs/DEPLOY.md.
  write_enabled: false
  user_agent_contact: "cmartyn@gmail.com"
  # Ceiling on how many state House pages one sweep will read for district
  # polls. Thirty-three states carry district polling today (Ingest::Sources::
  # DISTRICT_POLL_STATES, established by reading all fifty once); the ceiling
  # sits a little above that so the list can grow without the sweep's cost
  # growing unwatched. Anything past it is skipped and named in the log.
  # citation: docs/BUILD_NOTES.md Phase 8 §A (state-by-state district survey)
  max_district_sources: 40
feed:
  # The NYT poll files (the FiveThirtyEight database, continued) are the poll
  # corpus. Same cadence as the Wikipedia sweep it replaced: the files gain a
  # handful of polls a day, so two hours is generous, and the model-run floor
  # at :30 already assumes ingestion lands at :00.
  cadence_hours: 2
  # The files carry no API contract, so silence has to be a signal. In August
  # 2026 they gained ~2 polls a day; three days with an unchanged content
  # digest means the Times most likely moved or stopped the file, and the
  # sync records a partial run to say so.
  staleness_alarm_days: 3
internals:
  # How partisan-sponsored polls enter the incl_internals variant. The default
  # variant excludes them entirely; these constants only touch the toggled-on
  # view, so nothing here can move the headline forecast.
  #
  # Released internals historically run friendlier to their sponsor's side —
  # analyses of published campaign polling put the gap anywhere from two to
  # six points of margin, with release selection (commission many, publish
  # the flattering ones) as the mechanism. Three points is the middle of that
  # range and the prior the per-run empirical estimate is shrunk toward.
  # citation: https://fivethirtyeight.com/features/when-internal-polls-mislead-a-whole-campaign-may-be-to-blame/
  prior_shift: 3.0
  # Weight multiplier for a flagged poll once adjusted. Half, so an internal
  # is evidence but never outvotes an independent poll of the same race —
  # the same posture 538's models took.
  weight_factor: 0.5
  # A flagged poll pairs with unflagged polls of the same race and matchup
  # whose field end lands within this many days of its own; the margin gaps
  # of those pairs are what the empirical estimate is made of. Three weeks
  # trades pair count against the risk of reading real movement as bias.
  pair_window_days: 21
  # Pair-count shrinkage toward prior_shift, same shape as house_effects.
  # shrinkage_k: an estimate from n pairs keeps n/(n+k) of its own signal.
  shrinkage_k: 10.0
site:
  # How long the dashboard's data-source note stays up after the NYT poll
  # corpus first lands in an environment. The note arms itself off the first
  # feed poll's created_at and retires on its own — no deploy-day config and
  # no cleanup commit; this is only the length of the run.
  corpus_note_days: 7
  # Rolling comparison window for the dashboard's "Movers" module: the latest
  # succeeded model run is compared against the succeeded run closest to this
  # many days before it (closest, not "within" — history is short right now,
  # a handful of runs, so the module has to work with whatever exists).
  movers_window_days: 7
  # Below this many points of |Δ p_dem_win|, a shift is Monte Carlo noise, not
  # a mover. Five seeds on identical inputs measured ~1.4pp of run-to-run
  # noise on the Senate control probability at n_sims=10,000; 1.5 sits just
  # above that floor.
  #
  # STILL 1.5 after simulation.n_sims went to 100,000 on 2026-08-31, and this
  # is a deliberate lag rather than an oversight. The noise this floor guards
  # against is now ~0.44pp, so the floor could fall to about 0.5 — but a mover
  # is a DIFFERENCE between two runs, and ModelRun.comparison_run reaches back
  # movers_window_days for the other one. Until every run inside that window
  # was drawn at the new count, the comparison is mixed-vintage and still
  # carries the old run's 1.4pp. Drop this to ~0.5 no sooner than
  # movers_window_days after the first 100,000-sim run reaches production.
  # citation: docs/BUILD_NOTES.md Phase 3 §8.2 (10,000-sim noise measurement)
  movers_floor_pp: 1.5
  # How many races the dashboard's Movers module shows.
  movers_count: 6
  # A race whose leading side's win probability is at or under this renders
  # "Tossup" as its headline descriptor instead of "Favors {Party}". Editorial
  # language choice, not a model parameter — the underlying probability is
  # unchanged and still shown.
  tossup_band_pp: 65.0
