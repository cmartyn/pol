# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

# Fixture timestamps are inserted as raw SQL, so they do NOT go through
# Time.zone the way ModelRun.create!(started_at: "...") does — what you write
# here is what lands in Postgres, and the app reads it back as UTC before
# converting to Eastern for display. So this is 06:00 AM EDT written in UTC:
# a morning run, matching the 06:30 ET floor run in the real cron schedule.
model_run_one:
  started_at: 2026-08-01 10:00:00
  finished_at: 2026-08-01 10:00:47
  status: succeeded
  # Shaped like a real snapshot (Pol::Params.to_h), not flat: ModelRun#n_sims
  # digs simulation.n_sims out of it to label the site's figures, and a flat
  # fixture would silently exercise the fallback instead of the real path.
  params_snapshot:
    simulation:
      n_sims: 10000
    averaging:
      half_life_days: 14
  rng_seed: 20260801
  trigger: cron
