# The 2026 U.S. Senate map: 33 Class 2 seats plus the Florida and Ohio Class 3
# specials. Verified against Wikipedia and senate.gov on August 11, 2026 —
# see docs/BUILD_NOTES.md section A1 for the sources and for the list of races
# whose nominees are not settled yet.
#
# open_seat is true exactly when the sitting senator is not on the November
# ballot. `unsettled` is documentation only: it marks races where a listed
# candidate is a declared front-runner rather than a nominee, and it is why
# some races carry only one major-party candidate (we do not invent the other).
#
# Independents get no caucus_with unless they have said which way they would
# caucus. Dan Osborn, for one, has said he would caucus with neither party.
